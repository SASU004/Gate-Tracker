<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GATE 2027 · CS Syllabus Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0d0d0e;--panel:#171718;--line:#303032;--line-soft:#242426;--ink:#f2f2f0;--muted:#a09fa3;--dim:#737277;--accent:#d6ff37}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:14px} button{font:inherit}
    .topbar{height:73px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1170px)/2));gap:24px}
    .brand{display:flex;align-items:baseline;gap:7px;white-space:nowrap}.brand strong{font-size:16px;letter-spacing:-.6px}.brand .year{font-size:16px}.brand span{font-size:11px;color:var(--muted)}
    .exam{text-align:center;font-family:'DM Mono',monospace;line-height:1.05}.exam b{display:block;font-family:'Space Grotesk';font-size:21px;letter-spacing:-1px}.exam small{font-size:9px;color:#c2c1c3}.bar{width:114px;height:5px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0%;transition:width .25s}
    main{max-width:1170px;margin:22px auto 72px;padding:0 22px}.paper{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}.eyebrow{font:11px 'DM Mono',monospace;color:var(--muted);margin-bottom:5px}.paper h1{font-size:17px;margin:0 0 4px;letter-spacing:-.45px}.paper p{margin:0;font:11px 'DM Mono',monospace;color:#bab9bc}.paper-progress{display:flex;align-items:center;gap:13px}.paper-progress .bar{width:130px}.paper-progress b{font-size:18px}
    .section{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:10px;overflow:hidden}.section-head{width:100%;border:0;border-bottom:1px solid transparent;background:transparent;color:var(--ink);display:flex;align-items:center;text-align:left;padding:13px 15px;cursor:pointer}.section-head:hover{background:#1b1b1c}.num{width:32px;font:11px 'DM Mono',monospace;color:var(--muted)}.section-title{font-size:15px;font-weight:600}.section-count{font:11px 'DM Mono',monospace;color:var(--muted);margin-left:12px}.dots{margin-left:auto;display:flex;align-items:center;gap:4px}.progress-dot{width:7px;height:7px;border:1px solid #555559;border-radius:50%;background:transparent}.progress-dot.partial{border-color:#a8a8aa;background:#717176}.progress-dot.complete{border-color:var(--accent);background:var(--accent);box-shadow:0 0 7px #d6ff3770}.chevron{margin-left:16px;font-size:18px;color:#aaa;transition:transform .2s}.section.open .chevron{transform:rotate(180deg)}.section.open .section-head{border-bottom-color:var(--line-soft)}
    .topics{display:none;padding:13px 24px 16px}.section.open .topics{display:block}.group{padding:0 9px 16px}.group:last-child{padding-bottom:0}.group-label{font:10px 'DM Mono',monospace;color:#b4b3b5;letter-spacing:.1px;margin:0 0 9px}.topic{min-height:37px;display:flex;align-items:center;gap:9px;border-radius:5px;padding:4px 0}.topic:hover{background:#1c1c1d}.topic-name{flex:1;font-size:13px;line-height:1.25}.topic-dot{width:9px;height:9px;border:1px solid #939296;border-radius:100%;margin-left:0}.topic.done .topic-dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 2px #272b13}.actions{display:flex;gap:11px;margin-left:16px}.action{color:#b7b6b8;background:transparent;border:0;padding:4px 0;display:flex;align-items:center;gap:5px;cursor:pointer;font:10px 'DM Mono',monospace}.check{height:13px;width:13px;border:1px solid #909094;border-radius:3px;display:inline-grid;place-items:center;font:11px/1 sans-serif}.action.active{color:var(--ink)}.action.active .check{background:var(--accent);color:#111;border-color:var(--accent)}
    @media(max-width:700px){.topbar{padding:0 16px;gap:10px}.brand span{display:none}main{padding:0 12px;margin-top:14px}.paper{padding:14px}.paper-progress .bar{width:65px}.topics{padding:11px 10px}.group{padding:0 4px 13px}.section-head{padding:12px}.section-count{margin-left:8px}.dots{display:none}.topic{align-items:flex-start;padding:8px 2px;flex-wrap:wrap}.topic-name{min-width:calc(100% - 22px)}.actions{margin:0 0 0 18px;width:calc(100% - 18px);gap:16px}.exam small{display:none}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><strong>GATE</strong><strong class="year">2027</strong><span>CS Syllabus Tracker</span></div><div class="exam"><b id="daysRemaining">154</b><small>Days to Exam Window<br>*approx, official dates TBA</small></div></header>
  <main><section class="paper"><div><div class="eyebrow">Paper A</div><h1>CS — Computer Science &amp; Information Technology</h1><p>12 sections · 73 topics</p></div><div class="paper-progress"><div class="bar"><i id="paperBar"></i></div><b id="paperPercent">0%</b></div></section><div id="sections"></div></main>
  <script>
  const syllabus=[
    ['Engineering Mathematics',[['Linear Algebra',['Matrices and determinants','System of linear equations','Eigenvalues and eigenvectors','LU decomposition']],['Calculus',['Limits, continuity and differentiability','Maxima and minima','Mean value theorem','Integration']],['Probability and Statistics',['Random variables','Distributions: uniform, normal, exponential, Poisson, binomial','Mean, median, mode and standard deviation','Conditional probability and Bayes\' theorem']]]],
    ['Discrete Mathematics',[['Discrete Mathematics',['Propositional logic and first-order logic','Sets, relations, functions','Partial orders and lattices','Monoids and Groups','Graphs: connectivity, matching, colouring','Combinatorics: counting, recurrence relations, generating functions']]]],
    ['Digital Logic',[['Digital Logic',['Boolean algebra and minimization: algebraic technique, Karnaugh map, tabular method','Design of combinational circuits','Design of sequential circuits','Number representation and arithmetic (fixed point and floating point)']]]],
    ['Computer Organization & Architecture',[['Computer Organization',['Instruction set and addressing modes','Design of arithmetic and logic unit (ALU)','Design of control unit: hardwired and microprogrammed','Memory interfacing and hierarchy: performance, cache memory mapping','I/O interface: interrupt and DMA','Instruction pipelining and pipeline hazards']]]],
    ['Programming & Data Structures',[['Programming and Data Structures',['Programming in C','Recursion','Arrays, stacks, queues, linked lists','Trees and binary search trees','Binary heaps','Graphs']]]],
    ['Algorithms',[['Algorithms',['Searching, sorting, hashing','Asymptotic worst case time and space complexity','Design techniques: greedy, dynamic programming, divide-and-conquer','Graph traversals','Minimum spanning trees','Shortest paths']]]],
    ['Theory of Computation',[['Theory of Computation',['Regular expressions and finite automata','Context-free grammars and push-down automata','Regular and context-free languages','Pumping lemma','Turing machines and undecidability']]]],
    ['Compiler Design',[['Compiler Design',['Lexical analysis, parsing, syntax-directed translation','Runtime environments','Intermediate code generation','Local optimisation','Data flow analyses: constant propagation, liveness analysis, common sub-expression elimination']]]],
    ['Operating Systems',[['Operating Systems',['System calls, processes, threads','Inter-process communication','Concurrency and synchronization','Deadlock','CPU and I/O scheduling','Memory management and virtual memory','File systems']]]],
    ['Databases',[['Databases',['ER-model','Relational model: relational algebra, tuple calculus, SQL','Integrity constraints, normal forms','File organization and indexing (e.g., B and B+ trees)','Transactions and concurrency control']]]],
    ['Computer Networks',[['Computer Networks',['Principles of layering','Basics of switching: circuit, packet and virtual circuit; performance metrics','Data link layer: error detection, Medium Access Control, Ethernet','Routing: distance vector and link state','IPv4: fragmentation, CIDR notation, Network Address Translation','TCP: flow control and congestion control; socket API','DNS and HTTP']]]],
    ['General Aptitude',[['General Aptitude',['Verbal Aptitude','Quantitative Aptitude','Spatial Aptitude','Analytical Aptitude']]]]
  ];
  let state=JSON.parse(localStorage.getItem('gate-cs-2027')||'{}');
  if(!localStorage.getItem('gate-cs-2027-split-migrated')){const oldState=state;state={};Object.entries(oldState).forEach(([key,value])=>{const match=key.match(/^s(\d+)g(\d+)t(\d+)$/);if(!match)return;let[,section,group,topic]=match;section=+section;group=+group;if(section===0){if(group===0)state[`s1g0t${topic}`]=value;else state[`s0g${group-1}t${topic}`]=value}else state[`s${section+1}g${group}t${topic}`]=value});localStorage.setItem('gate-cs-2027',JSON.stringify(state));localStorage.setItem('gate-cs-2027-split-migrated','true')}
  let openSections=new Set([0]); const root=document.querySelector('#sections');
  function updateCountdown(){const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),examDate=new Date(2027,1,1),days=Math.max(0,Math.round((examDate-today)/86400000));document.querySelector('#daysRemaining').textContent=days} updateCountdown();
  const id=(s,g,t)=>`s${s}g${g}t${t}`; const topicTotal=syllabus.flatMap(x=>x[1]).flatMap(x=>x[1]).length;
  function progress(){let completeActions=0;syllabus.forEach(([,groups],s)=>groups.forEach(([,topics],g)=>topics.forEach((_,t)=>{let x=state[id(s,g,t)]||{};if(x.lec)completeActions++;if(x.pyq)completeActions++})));return Math.round(completeActions/(topicTotal*2)*100)}
  function draw(){root.innerHTML=syllabus.map(([name,groups],s)=>{let count=groups.flatMap(x=>x[1]).length, done=groups.flatMap(x=>x[1]).filter((_,i)=>{let pos=0;for(let g=0;g<groups.length;g++){for(let t=0;t<groups[g][1].length;t++,pos++)if(pos===i){let x=state[id(s,g,t)]||{};return x.lec&&x.pyq}}}).length,dots=groups.flatMap(x=>x[1]).map((_,i)=>{let pos=0;for(let g=0;g<groups.length;g++){for(let t=0;t<groups[g][1].length;t++,pos++)if(pos===i){let x=state[id(s,g,t)]||{},status=x.lec&&x.pyq?'complete':x.lec||x.pyq?'partial':'';return `<span class="progress-dot ${status}"></span>`}}}).join('');let open=openSections.has(s);return `<section class="section ${open?'open':''}" data-section="${s}"><button class="section-head" aria-expanded="${open}"><span class="num">${String(s+1).padStart(2,'0')}</span><span class="section-title">${name}</span><span class="section-count">${done}/${count}</span><span class="dots">${dots}</span><span class="chevron">⌄</span></button><div class="topics">${groups.map(([group,topics],g)=>`<div class="group"><div class="group-label">${group}</div>${topics.map((topic,t)=>{let x=state[id(s,g,t)]||{};let done=x.lec&&x.pyq;return `<div class="topic ${done?'done':''}"><span class="topic-dot"></span><span class="topic-name">${topic}</span><div class="actions"><button class="action ${x.lec?'active':''}" data-id="${id(s,g,t)}" data-action="lec"><span class="check">${x.lec?'✓':''}</span>Lectures</button><button class="action ${x.pyq?'active':''}" data-id="${id(s,g,t)}" data-action="pyq"><span class="check">${x.pyq?'✓':''}</span>PYQs</button></div></div>`}).join('')}</div>`).join('')}</div></section>`}).join('');updateProgress()}
  function updateProgress(){let p=progress();document.querySelector('#paperPercent').textContent=p+'%';document.querySelector('#paperBar').style.width=p+'%'}
  root.addEventListener('click',e=>{let action=e.target.closest('.action');if(action){let k=action.dataset.id;state[k]=state[k]||{};state[k][action.dataset.action]=!state[k][action.dataset.action];localStorage.setItem('gate-cs-2027',JSON.stringify(state));draw();return}let head=e.target.closest('.section-head');if(head){let section=head.closest('.section'),s=+section.dataset.section;if(openSections.has(s))openSections.delete(s);else openSections.add(s);section.classList.toggle('open');head.setAttribute('aria-expanded',section.classList.contains('open'))}});draw();
  </script>
</body>
</html>
